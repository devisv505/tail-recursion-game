name: Deploy site

# The site is plain HTML, CSS and JS — there is no build step and nothing to
# install. This uploads the repository as-is and publishes it to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Source -> "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # Canonical tags, JSON-LD and sitemap.xml need an absolute URL. Taking it
      # from the deployment rather than a constant means it stays correct
      # through a repository rename or a custom domain, with nothing to edit.
      # This only touches the uploaded artifact — it is never committed back.
      - name: Write canonical URLs and sitemap
        run: node tools/build-seo.mjs "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
